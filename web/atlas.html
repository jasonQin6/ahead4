<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>自然选择号 · 全舰 — three.js 版</title>
<meta name="description" content="自然选择号拼装模型的全舰 3D 复原（three.js 版）：双轨主炮、锥盾、主装甲、巨环、球形储罐、引擎组、尾鳍与展示支架。按需渲染、半分辨率 SSAO、索引化压缩顶点、CPU 拾取。">
<meta name="theme-color" content="#e3e6e8">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%2310161c%22%2F%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%236fd8ff%22%20stroke-width%3D%223%22%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2232%22%20r%3D%2217%22%2F%3E%3Cpath%20d%3D%22M6%2032h22M28%2027l8%205-8%205%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<style>
/* ============================================================
   自然选择号 · 全舰 — UI (three.js version)
   ============================================================ */
:root{
  --ink:#151b21;
  --ink2:#5d6a75;
  --ink3:#8b98a3;
  --line:rgba(15,25,35,.13);
  --line2:rgba(15,25,35,.26);
  --glass:rgba(255,255,255,.62);
  --glass2:rgba(255,255,255,.34);
  --glass-solid:rgba(248,250,251,.86);
  --accent:#0b7f9e;
  --accent-soft:rgba(11,127,158,.12);
  --mono:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --sans:"SF Pro Text","SF Pro Display","PingFang SC","Helvetica Neue",system-ui,sans-serif;
  --shadow:0 14px 44px rgba(15,30,45,.12), 0 2px 8px rgba(15,30,45,.05);
}
body.dark{
  --ink:#e9f0f6;
  --ink2:#a9bac8;
  --ink3:#7d8fa0;
  --line:rgba(150,195,230,.16);
  --line2:rgba(150,195,230,.32);
  --glass:rgba(13,21,30,.58);
  --glass2:rgba(13,21,30,.3);
  --glass-solid:rgba(11,18,26,.86);
  --accent:#63d9ff;
  --accent-soft:rgba(99,217,255,.12);
  --shadow:0 18px 50px rgba(0,0,0,.5), 0 2px 10px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#e3e6e8}
body{
  font-family:var(--sans);color:var(--ink);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  transition:color .4s ease;
  user-select:none;
  -webkit-user-select:none;
}
body.dark{background:#05080c}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none;background:transparent}
#gl.dragging{cursor:grabbing}
#leaders{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3;overflow:visible;contain:layout style}
#leaders line{stroke:var(--line2);stroke-width:.9}
#leaders circle{fill:var(--accent);opacity:.85}
#labels{position:fixed;inset:0;pointer-events:none;z-index:4;contain:layout style}
.lbl{
  position:absolute;left:0;top:0;display:flex;align-items:center;gap:7px;
  padding:3px 9px 3px 5px;border:1px solid var(--line);
  background:var(--glass);backdrop-filter:blur(10px) saturate(1.2);-webkit-backdrop-filter:blur(10px) saturate(1.2);
  border-radius:999px;font-size:11px;letter-spacing:.03em;color:var(--ink2);
  white-space:nowrap;transform:translate(-50%,-50%);
  transition:opacity .3s ease,color .3s ease,border-color .3s ease,background .3s ease;
  box-shadow:0 2px 12px rgba(10,25,40,.07);
  opacity:0;will-change:translate,opacity;
}
.lbl.on{opacity:1}
.lbl .n{font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--accent);opacity:.9}
.lbl .t{font-weight:450}
.lbl.sel{color:var(--ink);border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset,0 4px 16px rgba(10,25,40,.1)}
.lbl.hidden{opacity:.34 !important}
.lbl.hidden .t{text-decoration:line-through}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#gl:focus{outline:none}
.btn:focus-visible,.row:focus-visible,.mini:focus-visible,.themebtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------------- hero ---------------- */
.hero{position:fixed;left:36px;top:30px;z-index:6;pointer-events:none}
.eyebrow{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;color:var(--ink3);text-transform:uppercase}
.eyebrow .tag{padding:2.5px 7px 2px;border:1px solid var(--line2);border-radius:3px;color:var(--accent);letter-spacing:.14em}
h1{margin:12px 0 7px;font-size:42px;line-height:1;font-weight:250;letter-spacing:.055em}
h1 b{font-weight:500;color:var(--accent);letter-spacing:.02em;font-size:20px;margin-left:12px;vertical-align:2px}
.sub{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--ink2);text-transform:uppercase}
.hero .rule{width:64px;height:1px;margin-top:16px;background:var(--accent);opacity:.85}

/* ---------------- left panel ---------------- */
.panel{
  position:fixed;left:24px;top:160px;bottom:92px;width:306px;z-index:7;
  display:flex;flex-direction:column;
  background:var(--glass);backdrop-filter:blur(22px) saturate(1.25);-webkit-backdrop-filter:blur(22px) saturate(1.25);
  border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  overflow:hidden;transition:background .4s ease,border-color .4s ease,opacity .3s,transform .3s;
}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;padding:15px 17px 11px;border-bottom:1px solid var(--line)}
.panel-head .t{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--ink2)}
.panel-head .c{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--ink3)}
.list{overflow:auto;flex:1 1 auto;min-height:0;padding:6px 6px 8px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.list::-webkit-scrollbar{width:5px}
.list::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
.row{
  display:grid;grid-template-columns:26px 1fr 22px;align-items:center;gap:8px;
  padding:3px 9px 3px 10px;border-radius:8px;cursor:pointer;position:relative;
  border:1px solid transparent;transition:background .18s,border-color .18s,opacity .25s;
}
.row:hover,.row.hover{background:var(--glass2);border-color:var(--line)}
.row.sel{background:var(--accent-soft);border-color:var(--line2)}
.row.sel .nm{color:var(--ink)}
.row.hid{opacity:.42}
.row .num{font-family:var(--mono);font-size:9px;color:var(--ink3);letter-spacing:.06em}
.row.sel .num{color:var(--accent)}
.row .nm{font-size:12px;line-height:1.25;letter-spacing:.02em;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .en{display:block;font-family:var(--mono);font-size:7.5px;letter-spacing:.12em;color:var(--ink3);margin-top:2px;opacity:.9}
.row .eye{width:22px;height:22px;border:0;background:transparent;color:var(--ink3);cursor:pointer;border-radius:5px;display:flex;align-items:center;justify-content:center;padding:0;opacity:.65;transition:.18s}
.row .eye:hover{background:var(--glass2);color:var(--ink);opacity:1}
.row .eye.off{opacity:.32}
.row .eye svg{width:13px;height:13px;display:block}

/* detail */
.detail{padding:11px 16px 12px;border-top:1px solid var(--line);background:var(--glass2);min-height:108px;flex:0 0 auto}
.detail .dtop{display:flex;justify-content:space-between;align-items:center}
.detail .dnum{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--accent)}
.detail .dname{font-size:15px;font-weight:500;letter-spacing:.04em;margin:5px 0 1px}
.detail .den{font-family:var(--mono);font-size:8px;letter-spacing:.18em;color:var(--ink3)}
.detail p{margin:7px 0 0;font-size:10.5px;line-height:1.55;color:var(--ink2);letter-spacing:.015em}
.detail .empty{font-size:11px;line-height:1.7;color:var(--ink3);margin-top:4px}
.detail .acts{display:flex;gap:7px;margin-top:9px}
.detail .acts:empty{display:none}
.mini{
  font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;color:var(--ink2);
  padding:5px 9px;border:1px solid var(--line2);border-radius:5px;background:transparent;cursor:pointer;
  transition:.18s;text-transform:uppercase
}
.mini:hover{color:var(--ink);border-color:var(--ink3);background:var(--glass2)}
.hide-small{display:initial}

/* ---------------- bottom bar ---------------- */
.bar{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:8;
  display:flex;align-items:center;gap:5px;padding:5px;
  background:var(--glass);backdrop-filter:blur(22px) saturate(1.25);-webkit-backdrop-filter:blur(22px) saturate(1.25);
  border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow);
  transition:background .4s,border-color .4s;
}
.btn{
  display:flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;
  border:1px solid transparent;background:transparent;color:var(--ink2);cursor:pointer;
  font-family:var(--sans);font-size:11px;letter-spacing:.04em;transition:.18s;white-space:nowrap;
}
.btn:hover{background:var(--glass2);color:var(--ink)}
.btn.on{background:var(--accent-soft);border-color:var(--line2);color:var(--accent)}
.btn svg{width:13px;height:13px;opacity:.85}
.bar .sep{width:1px;height:20px;background:var(--line);margin:0 2px}
.expl{display:flex;align-items:center;gap:9px;padding:0 8px 0 4px}
.expl .lb{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;color:var(--ink3);text-transform:uppercase}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:104px;height:20px;background:transparent;cursor:pointer;
}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line2);border-radius:2px}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:11px;height:11px;margin-top:-4.5px;border-radius:50%;
  background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);
}
input[type=range]::-moz-range-track{height:2px;background:var(--line2)}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border:0;border-radius:50%;background:var(--accent)}
.bar .theme{display:flex;align-items:center;gap:2px;background:var(--glass2);border-radius:999px;padding:2px}
.bar .theme .btn{height:26px;padding:0 9px;font-size:10px;border-radius:999px}
.bar .theme .btn.on{background:var(--glass-solid);color:var(--ink);border-color:var(--line2);box-shadow:0 1px 4px rgba(10,20,30,.08)}

/* ---------------- misc overlays ---------------- */
.hint{
  position:fixed;left:26px;bottom:34px;z-index:6;font-family:var(--mono);font-size:9px;
  letter-spacing:.12em;color:var(--ink2);opacity:.85;text-transform:uppercase;pointer-events:none;
  display:flex;align-items:center;gap:15px;
}
.hint .k{color:var(--ink);opacity:.9}
.axes{position:fixed;right:26px;bottom:30px;width:88px;height:88px;z-index:6;pointer-events:none}
.axes text{font-family:var(--mono);font-size:7.5px;letter-spacing:.05em;fill:var(--ink3)}
.axes line{stroke-width:1;stroke-linecap:round}
.axes .ax1{stroke:var(--accent)}
.axes .ax2{stroke:var(--ink2);opacity:.7}
.axes .ax3{stroke:var(--ink3);opacity:.7}
.meta{
  position:fixed;right:70px;top:34px;z-index:6;text-align:right;pointer-events:none;
  font-family:var(--mono);font-size:8.5px;line-height:1.9;letter-spacing:.12em;color:var(--ink2);opacity:.85;text-transform:uppercase;
}
.meta b{font-weight:500;color:var(--ink2)}
.themebtn{
  position:fixed;right:26px;top:30px;z-index:9;width:30px;height:30px;border-radius:50%;
  border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);
  color:var(--ink2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;
}
.themebtn:hover{color:var(--ink);border-color:var(--ink3)}
.themebtn svg{width:14px;height:14px}

/* ---------------- performance overlay ---------------- */
.perf{
  position:fixed;right:26px;top:114px;z-index:9;display:none;min-width:196px;
  padding:10px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--glass);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
  box-shadow:var(--shadow);pointer-events:none;
  font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;color:var(--ink3);
}
.perf.on{display:grid;gap:3px}
.perf div{display:flex;justify-content:space-between;gap:18px;white-space:nowrap}
.perf b{font-weight:500;color:var(--ink)}

/* ---------------- boot ---------------- */
#boot{
  position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:#e3e6e8;transition:opacity .7s ease;font-family:var(--mono);
}
body.dark #boot{background:#05080c}
#boot .b1{font-size:9px;letter-spacing:.3em;color:#8b98a3;text-transform:uppercase}
#boot .b2{font-size:18px;letter-spacing:.2em;color:#151b21;font-weight:300}
body.dark #boot .b2{color:#e9f0f6}
#boot .bar2{width:120px;height:1px;background:rgba(15,25,35,.15);position:relative;overflow:hidden}
#boot .bar2 i{position:absolute;left:0;top:0;height:100%;width:40%;background:#0b7f9e;animation:bl 1.1s ease-in-out infinite}
#boot.failed .bar2{display:none}
@keyframes bl{0%{left:-40%;width:40%}50%{left:30%;width:55%}100%{left:100%;width:30%}}
#boot.gone{opacity:0;pointer-events:none}

.noscript{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:#e3e6e8;font-family:system-ui;color:#151b21;font-size:14px;z-index:99;
}

@media (max-width:1180px){
  .panel{width:280px}
  h1{font-size:34px}
  .meta{display:none}
}
@media (max-width:860px){
  .hero{left:20px;top:18px}
  h1{font-size:26px;margin-top:10px}
  .sub{display:none}
  .eyebrow{font-size:8px}
  .panel{
    left:8px;right:8px;top:auto;bottom:100px;width:auto;height:auto;max-height:44vh;
    transform:translateY(calc(100% + 80px));transition:transform .35s cubic-bezier(.2,.7,.2,1),opacity .3s;
    opacity:0;pointer-events:none;
  }
  .panel.open{transform:translateY(0);opacity:1;pointer-events:auto}
  .panel .detail{display:none}
  .bar{bottom:10px;padding:4px;gap:2px;max-width:calc(100vw - 16px);flex-wrap:wrap;justify-content:center;border-radius:16px}
  .bar .expl{padding:0 2px}
  .bar .expl .lb{display:none}
  input[type=range]{width:64px}
  .hint{display:none}
  .axes{display:none}
  .meta{display:none}
  .btn{padding:0 7px;font-size:10px;height:28px}
  .btn svg{width:12px;height:12px}
  .btn span{display:none}
  .btn.on span{display:inline}
  .bar .sep{display:none}
  .themebtn{top:20px;right:16px}
  .perf{top:58px;right:16px;min-width:176px;font-size:8px}
  .only-narrow{display:flex}
  .lbl{font-size:10px;padding:2px 8px 2px 4px}
}
.only-narrow{display:none}
@media (max-width:860px){ .only-narrow{display:flex} }

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
}
body.reduce-motion .lbl{transition:none}

</style>
</head>
<body>
<canvas id="gl" aria-label="自然选择号全舰三维视图，可拖拽旋转、滚轮缩放、点击构件"></canvas>
<svg id="leaders" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
<div id="labels" aria-hidden="true"></div>

<div class="hero">
  <div class="eyebrow"><span class="tag">three.js</span><span>完整舰体 / 全舰组装</span></div>
  <h1>自然选择号<b>全舰</b></h1>
  <div class="sub">NATURAL SELECTION · FLAGSHIP — 双轨主炮 → 巨环 → 引擎组 → 尾鳍</div>
  <div class="rule"></div>
</div>

<div class="meta" id="meta"></div>
<button type="button" class="themebtn" id="themeBtn" title="切换影棚 / 深空" aria-label="切换影棚 / 深空">◐</button>
<div class="perf" id="perf" aria-hidden="true"></div>

<aside class="panel" id="panel" aria-label="构件列表">
  <div class="panel-head"><span class="t">构件 / MODULES</span><span class="c" id="modCount">15</span></div>
  <div class="list" id="list"></div>
  <div class="detail" id="detail"></div>
</aside>

<div class="bar" id="bar" role="toolbar" aria-label="视图控制">
  <button type="button" class="btn" id="btnExplode" title="分解 / 装配 (E)" aria-pressed="false">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M8 2v12M2.5 5l11 6M13.5 5l-11 6"/></svg>
    <span>分解</span>
  </button>
  <div class="expl"><span class="lb">EXPLODE</span><input id="explode" type="range" min="0" max="100" value="0" aria-label="分解程度"></div>
  <div class="sep"></div>
  <button type="button" class="btn on" id="btnLabels" title="构件标注 (L)" aria-pressed="true">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><circle cx="4" cy="12" r="1.4"/><path d="M5 11l4.5-6H14"/></svg>
    <span>标注</span>
  </button>
  <button type="button" class="btn" id="btnAuto" title="自动环绕 (空格)" aria-pressed="false">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.6-3.7"/><path d="M13 2v3h-3"/></svg>
    <span>环绕</span>
  </button>
  <div class="sep"></div>
  <div class="theme" id="themeSeg" role="group" aria-label="主题">
    <button type="button" class="btn on" data-theme="light" aria-pressed="true">影棚</button>
    <button type="button" class="btn" data-theme="dark" aria-pressed="false">深空</button>
  </div>
  <button type="button" class="btn only-narrow" id="btnPanel" title="构件列表" aria-expanded="false" aria-controls="panel">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M3 4h10M3 8h10M3 12h10"/></svg>
    <span>构件</span>
  </button>
  <button type="button" class="btn" id="btnStand" title="展示支架">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M3 13h10M8 13v-3M5 10h6l-1-2H6l-1 2Z"/></svg>
    <span>支架</span>
  </button>
  <button type="button" class="btn" id="btnReset" title="复位视角 (R)">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M3 8a5 5 0 1 0 1.6-3.7"/><path d="M3 2v3h3"/></svg>
    <span>复位</span>
  </button>
</div>

<div class="hint" aria-hidden="true">
  <span><span class="k">拖拽</span> 旋转</span>
  <span><span class="k">滚轮</span> 缩放</span>
  <span><span class="k">点击</span> 构件</span>
  <span><span class="k">空格</span> 环绕</span>
  <span><span class="k">P</span> 性能</span>
</div>

<svg class="axes" viewBox="0 0 88 88" id="axes" aria-hidden="true">
  <circle cx="44" cy="44" r="26" fill="none" stroke="var(--line)" stroke-width=".8"/>
  <line id="axx" class="ax1" x1="44" y1="44" x2="44" y2="20"/>
  <line id="axy" class="ax2" x1="44" y1="44" x2="44" y2="20"/>
  <line id="axz" class="ax3" x1="44" y1="44" x2="44" y2="20"/>
  <text id="tx" x="44" y="14" text-anchor="middle" fill="var(--accent)">前</text>
  <text id="ty" x="44" y="14" text-anchor="middle">上</text>
  <text id="tz" x="44" y="14" text-anchor="middle">左</text>
</svg>

<noscript><div class="noscript">请启用 JavaScript 以查看 3D 全舰</div></noscript>
<div id="boot">
  <div class="b1">NATURAL SELECTION — THREE.JS</div>
  <div class="b2">正在构建全舰网格</div>
  <div class="bar2"><i></i></div>
